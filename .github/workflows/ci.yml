# Pipeline CI para SuperMarketBackEnd (DEV, QA y PROD)
name: CI - SuperMarketBackEnd

on:
  push:
    branches: [DEV, QA, PROD]
  pull_request:
    branches: [DEV, QA, PROD]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-db:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: supermarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d supermarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://neondb_owner:npg_IDUrXJzZ72Nh@ep-noisy-leaf-ai0c2c0h-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      SSL_MODE: disable
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit pytest

      - name: Sincronizar esquema con DB (Alembic)
        run: alembic upgrade head

      - name: Verificar datos iniciales de roles
        run: |
          python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['DATABASE_URL']); c = e.connect(); n = c.execute(text(\"SELECT count(*) FROM roles WHERE nombre IN ('admin','empleado')\")).scalar(); c.close(); assert n >= 2, f'Seed incompleto: {n}'; print(f'Roles base OK: {n}')"

      - name: Lint con Ruff
        run: ruff check src --output-format=github

      - name: Formato con Ruff
        run: ruff format src --check

      - name: Verificar vulnerabilidades (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Pruebas (pytest)
        run: pytest -q
